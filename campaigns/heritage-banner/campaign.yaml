metadata:
  brand_id: heritage-banner
  creative_revision: 2026-08-29-nonprofit-membership-v1
  campaign_objective: Build qualified interest by showing how modern storytelling can make a heritage nonprofit's work relevant visible and participatory.
  value_proposition: Heritage Banner creates done-for-you short-form social stories for heritage nonprofits.
  desired_emotional_response: practical hope followed by a specific desire to involve younger and newer people
  hashtags: ["#TheHeritageBanner", "#HeritageNonprofits"]
  production_status: generation-only
  legacy_source: campaigns/heritage-banner/marketing-plan.json
  mpt_defaults: {video_concat_mode: sequential, video_transition_mode: null, video_clip_duration: 5, match_materials_to_script: true, video_count: 1}
