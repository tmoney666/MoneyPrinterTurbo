schema_version: 1.0.0
campaign_id: heritage-banner-facebook
display_name: Heritage Banner
description: Done-for-you short-form social storytelling for heritage nonprofits seeking to involve younger and newer people.
enabled: true
timezone: America/Chicago
enabled_platforms: [facebook]
default_content_type: vertical_reel
default_aspect_ratio: "9:16"
min_duration_seconds: 20
max_duration_seconds: 60
posting_cadence:
  frequency: daily
  local_time: "09:00"
  days_of_week: [0, 1, 2, 3, 4, 5, 6]
target_audience:
  description: Active members and volunteers who champion historical societies, local museums, preservation groups, genealogical organizations, and similar heritage nonprofits.
  problems:
    - Membership responsibility and institutional knowledge can become concentrated among a small group.
    - Insider language and vague invitations can hide meaningful ways for younger and newer people to contribute.
    - Digital visibility may not show the people, work, and participation paths behind the mission.
  interests: [heritage nonprofits, member engagement, volunteer participation, nonprofit storytelling, intergenerational collaboration]
  motivations: [share responsibility, involve younger and newer people, make mission work visible, create meaningful entry points]
brand_positioning: Heritage Banner creates done-for-you short-form social stories designed to help heritage nonprofits reach and involve younger and newer people.
brand_voice: [opportunity-forward, candid, practical, intergenerational, respectful, hopeful]
tone_constraints:
  - Avoid sensationalism
  - Avoid age stereotypes and generational blame
  - Avoid dying organization language
  - Avoid guarantees about recruitment retention fundraising or survival
  - Avoid implying digital content alone solves retention
content_pillars:
  - id: membership-continuity
    name: Membership continuity
    audience_goals: [share knowledge and responsibility, make succession participatory]
    themes:
      - {id: continuity-signals, name: Continuity signals, audience_goal: Turn membership patterns into practical action.}
      - {id: shared-knowledge, name: Shared knowledge, audience_goal: Make institutional knowledge easier to share.}
    allowed_story_formats: [practical-action, participation-reframe, organization-story]
    preferred_hooks: [recognition, contrast]
    preferred_ctas: [Choose one responsibility your organization can begin sharing.]
    visual_treatments: [members planning together, shared project documentation]
  - id: relevant-organizational-stories
    name: Relevant organizational stories
    audience_goals: [connect history to current relevance, show mission through human work]
    themes:
      - {id: present-relevance, name: Present relevance, audience_goal: Connect heritage work to questions people recognize now.}
      - {id: human-mission-work, name: Human mission work, audience_goal: Show members doing the work behind the mission.}
    allowed_story_formats: [organization-story, behind-the-scenes, practical-action]
    preferred_hooks: [relevance, human-action]
    preferred_ctas: [Choose one member action to carry your next story.]
    visual_treatments: [museum volunteers at work, exhibit and program preparation]
  - id: meaningful-entry-points
    name: Meaningful entry points
    audience_goals: [make contribution specific, move interest toward participation]
    themes:
      - {id: project-sized-roles, name: Project-sized roles, audience_goal: Offer bounded work with a visible finish line.}
      - {id: co-created-participation, name: Co-created participation, audience_goal: Let newcomers shape real work.}
    allowed_story_formats: [practical-action, participation-reframe, organization-story]
    preferred_hooks: [specific-invitation, contribution]
    preferred_ctas: [Name one project a younger or newer member could help shape.]
    visual_treatments: [new volunteer joining a project, shared storyboarding]
  - id: intergenerational-collaboration
    name: Intergenerational collaboration
    audience_goals: [support two-way mentoring, share ownership across experience levels]
    themes:
      - {id: mutual-learning, name: Mutual learning, audience_goal: Combine complementary experience and skills.}
      - {id: shared-ownership, name: Shared ownership, audience_goal: Involve newer members in real decisions.}
    allowed_story_formats: [participation-reframe, practical-action, organization-story]
    preferred_hooks: [shared-strength, ownership]
    preferred_ctas: [Pair two members around one project where each can teach.]
    visual_treatments: [mixed-experience project teams, collaborative editing]
  - id: digital-front-door
    name: The digital front door
    audience_goals: [introduce people and work, explain participation clearly]
    themes:
      - {id: visible-participation, name: Visible participation, audience_goal: Show how someone can contribute.}
      - {id: useful-signals, name: Useful signals, audience_goal: Learn from inquiries and participation questions.}
    allowed_story_formats: [organization-story, behind-the-scenes, practical-action]
    preferred_hooks: [digital-introduction, visible-next-step]
    preferred_ctas: [Show one real way a younger or newer person can contribute.]
    visual_treatments: [vertical video production, nonprofit social planning]
themes: [membership continuity, relevant mission stories, project-sized roles, co-created content, two-way mentoring, shared ownership, visible participation, digital introductions, volunteer intent, nonprofit storytelling]
story_formats:
  - id: practical-action
    name: Practical organization action
    beat_structure: [hook, context, discovery, resolution, cta]
    hook_patterns: ["One clear action can change how {topic} works inside an organization."]
  - id: participation-reframe
    name: Participation reframe
    beat_structure: [hook, setup, contrast, resolution, cta]
    hook_patterns: ["What changes when {topic} becomes shared work?"]
  - id: organization-story
    name: Organization story
    beat_structure: [hook, context, example, resolution, cta]
    hook_patterns: ["One human action can make {topic} easier to enter."]
  - id: behind-the-scenes
    name: Behind the scenes
    beat_structure: [hook, setup, discovery, example, cta]
    hook_patterns: ["The work behind {topic} can show where people belong."]
allowed_formats: [practical-action, participation-reframe, organization-story, behind-the-scenes]
preferred_formats: [practical-action, organization-story, behind-the-scenes]
disallowed_formats: []
hook_styles: [recognition, contrast, relevance, human-action, specific-invitation, contribution, shared-strength, ownership, digital-introduction, visible-next-step]
calls_to_action:
  - Name one project a younger or newer member could help shape.
  - Choose one responsibility your organization can begin sharing.
  - Show one real way a younger or newer person can contribute.
  - Make the next invitation specific enough to act on.
  - Heritage Banner can turn that work into short social stories.
  - Heritage Banner can help make that participation path visible.
caption_styles: [short_social, organization_prompt, participation_prompt]
visual_styles: [warm documentary teamwork, heritage nonprofit work, short-form story production, members and volunteers in action]
seasonal_rules:
  - id: year-end-participation
    start_month_day: "11-15"
    end_month_day: "12-31"
    eligible_seed_ids: [hb-org-020, hb-org-023, hb-org-025, hb-org-030]
    weight_multiplier: 1.8
content_exclusions:
  - invented genealogy
  - age stereotypes or generational blame
  - dying organization language
  - invented results testimonials organizations people dates quotations or historical claims
  - guaranteed recruitment retention fundraising participation or survival
  - individual or family preservation calls to action
duplicate_cooldown_days: 30
cooldowns: {topic: 30, theme: 3, hook: 14, story_format: 3, script: 3650, caption: 14, visual_concept: 7, media: 3650}
safety_constraints:
  - Keep the heritage nonprofit as the audience and actor.
  - Use younger and newer without assigning skills or limitations by age.
  - Family stories recipes and artifacts may appear only as nonprofit programming or member-engagement examples.
  - Do not promise that digital content alone produces recruitment or retention.
